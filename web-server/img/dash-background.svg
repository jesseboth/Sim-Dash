<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- Golf R cluster background, drawn after img/dash-background.png at the same size.
       The panel is mirror-symmetric about x=1940, the centre of the RPM strip above it. -->
  <defs>
    <clipPath id="panel"><path d="M112 462 C150 440 200 422 280 414 L920 398 C990 396 1010 400 1040 410 L1200 493 C1240 507 1260 510 1300 510 L1940 510 L2580 510 C2620 510 2640 507 2680 493 L2840 410 C2870 400 2890 396 2960 398 L3600 414 C3680 422 3730 440 3768 462 C3790 475 3800 500 3800 560 L3798 1480 C3798 1520 3810 1540 3835 1552 C3790 1568 3735 1592 3660 1601 L2820 1597 C2780 1597 2760 1592 2730 1583 L2490 1513 C2460 1505 2440 1504 2410 1504 L1940 1504 L1470 1504 C1440 1504 1420 1505 1390 1513 L1150 1583 C1120 1592 1100 1597 1060 1597 L220 1601 C145 1592 90 1568 45 1552 C70 1540 82 1520 82 1480 L80 560 C80 500 90 475 112 462 Z"/></clipPath>

    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a10"/>
      <stop offset="0.55" stop-color="#08070c"/>
      <stop offset="1" stop-color="#0a0912"/>
    </linearGradient>

    <!-- Perforated floor: small rounded slots on an offset grid -->
    <pattern id="slots" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#b3abac"/>
      <rect x="2" y="3" width="13" height="6" rx="2.5" fill="#15132a"/>
      <rect x="16" y="17" width="13" height="6" rx="2.5" fill="#15132a"/>
      <rect x="-12" y="17" width="13" height="6" rx="2.5" fill="#15132a"/>
    </pattern>
    <!-- The floor fades in from the horizon and is darker at the outer edges -->
    <linearGradient id="floorFadeV" x1="0" y1="1150" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="floorFadeH" x1="0" y1="0" x2="3840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="0.12" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="0.88" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <mask id="floorMask" maskUnits="userSpaceOnUse" x="0" y="1000" width="3840" height="700">
      <rect x="0" y="1000" width="3840" height="700" fill="url(#floorFadeV)"/>
    </mask>

    <radialGradient id="blueGlow" cx="1920" cy="1450" r="700" gradientUnits="userSpaceOnUse" gradientTransform="translate(1920 1450) scale(1 0.32) translate(-1920 -1450)">
      <stop offset="0" stop-color="#4f86ff" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#3d63e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d63e0" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizon: a fine silver line, brightest at the centre, with a soft sheen above it -->
    <linearGradient id="horizonLine" x1="150" y1="0" x2="3690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3846" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#4b4958" stop-opacity="0.8"/>
      <stop offset="0.32" stop-color="#6d6a7c"/>
      <stop offset="0.5" stop-color="#f1edf2"/>
      <stop offset="0.68" stop-color="#6d6a7c"/>
      <stop offset="0.85" stop-color="#4b4958" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a3846" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="1920" cy="1062" r="1150" gradientUnits="userSpaceOnUse" gradientTransform="translate(1920 1062) scale(1 0.07) translate(-1920 -1062)">
      <stop offset="0" stop-color="#d9d4e6" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#8d88a3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8d88a3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lens" cx="1920" cy="1062" r="1280" gradientUnits="userSpaceOnUse" gradientTransform="translate(1920 1062) scale(1 0.06) translate(-1920 -1062)">
      <stop offset="0" stop-color="#f4f1f6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#bdb8c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d6a7c" stop-opacity="0"/>
    </radialGradient>

    <filter id="edgeGlow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Panel -->
  <path d="M112 462 C150 440 200 422 280 414 L920 398 C990 396 1010 400 1040 410 L1200 493 C1240 507 1260 510 1300 510 L1940 510 L2580 510 C2620 510 2640 507 2680 493 L2840 410 C2870 400 2890 396 2960 398 L3600 414 C3680 422 3730 440 3768 462 C3790 475 3800 500 3800 560 L3798 1480 C3798 1520 3810 1540 3835 1552 C3790 1568 3735 1592 3660 1601 L2820 1597 C2780 1597 2760 1592 2730 1583 L2490 1513 C2460 1505 2440 1504 2410 1504 L1940 1504 L1470 1504 C1440 1504 1420 1505 1390 1513 L1150 1583 C1120 1592 1100 1597 1060 1597 L220 1601 C145 1592 90 1568 45 1552 C70 1540 82 1520 82 1480 L80 560 C80 500 90 475 112 462 Z" fill="url(#inside)"/>

  <g clip-path="url(#panel)">
    <!-- Floor -->
    <g mask="url(#floorMask)">
      <rect x="0" y="1060" width="3840" height="600" fill="url(#slots)"/>
      <rect x="0" y="1060" width="3840" height="600" fill="url(#floorFadeH)"/>
    </g>
    <ellipse cx="1920" cy="1450" rx="700" ry="224" fill="url(#blueGlow)"/>

    <!-- Horizon -->
    <path d="M640 1062 Q1920 990 3200 1062 Z" fill="url(#lens)"/>
    <rect x="770" y="960" width="2300" height="102" fill="url(#sheen)"/>
    <rect x="150" y="1058" width="3540" height="6" fill="url(#horizonLine)"/>
  </g>

