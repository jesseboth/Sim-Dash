    <path d="M45 1552 C90 1568 145 1592 220 1601 L1060 1597 C1100 1597 1120 1592 1150 1583 L1390 1513 C1420 1505 1440 1504 1470 1504 L1940 1504 L2410 1504 C2440 1504 2460 1505 2490 1513 L2730 1583 C2760 1592 2780 1597 2820 1597 L3660 1601 C3735 1592 3790 1568 3835 1552" stroke="#2f80ff" stroke-width="15"/>
    <path d="M112 462 C150 440 200 422 280 414 L920 398 C990 396 1010 400 1040 410 L1200 493 C1240 507 1260 510 1300 510 L1940 510 L2580 510 C2620 510 2640 507 2680 493 L2840 410 C2870 400 2890 396 2960 398 L3600 414 C3680 422 3730 440 3768 462" stroke="#7fb4ff" stroke-width="3" stroke-opacity="0.7"/>
